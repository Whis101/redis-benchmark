services:
  web:
    build: .
    container_name: redis-benchmark-web
    ports:
      - "5000:5000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
  redis:
    image: redis:7
    container_name: redis-benchmark-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
